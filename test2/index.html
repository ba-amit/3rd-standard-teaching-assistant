    function renderWorksheet(id) {
      const ws = WORKSHEETS[id];
      worksheetBodyEl.innerHTML = "";
      ws.sections.forEach(sec => worksheetBodyEl.appendChild(SECTION_RENDERERS[sec.type](sec)));
      worksheetBodyEl.scrollTop = 0;
      counterEl.textContent = "";
      setNameEl.textContent = ws.title;
    }

    function clearWorksheet() {
      worksheetBodyEl.querySelectorAll("input[type=text], input[type=radio], textarea").forEach(el => {
        if (el.type === "radio") el.checked = false; else el.value = "";
      });
      worksheetBodyEl.querySelectorAll(".picked, .active").forEach(el => el.classList.remove("picked", "active"));
      worksheetBodyEl.querySelectorAll("details[open]").forEach(d => { d.open = false; });
    }
    // Printed revision notes should carry the answers, so open every one.
    window.addEventListener("beforeprint", () =>
      worksheetBodyEl.querySelectorAll("details").forEach(d => { d.open = true; }));

    function openDrawer() {
      sidebarEl.classList.add("open");
      overlayEl.classList.add("show");
    }

    function closeDrawer() {
      sidebarEl.classList.remove("open");
      overlayEl.classList.remove("show");
    }

    function setSet(name) {
      currentSet = name;
      setNameEl.textContent = setLabels[name];
      document.querySelectorAll(".tab.set").forEach(b =>
        b.classList.toggle("active", b.dataset.set === name));
      reshuffle();
    }

    // Dictation self-check. The letter is written into the DOM only when the
    // kid flips the card, and wiped again on the next letter.
    function resetReveal() {
      revealCardEl.classList.remove("flipped");
      revealLetterEl.textContent = "";
      revealWordEl.textContent = "";
      revealRomanEl.textContent = "";
    }

    function toggleReveal() {
      if (!deck[index]) return;
      if (revealCardEl.classList.contains("flipped")) { resetReveal(); return; }
      const [letter, word, roman, emoji] = deck[index];
      revealLetterEl.textContent = letter;
      revealWordEl.textContent = `${emoji} ${word}`;
      revealRomanEl.textContent = roman;
      revealCardEl.classList.add("flipped");
    }

    function flipCard() {
      flipped = !flipped;
      cardEl.classList.toggle("flipped", flipped);
      stopSpeaking();
      if (autoSpeakEl.checked) {
        flipped ? speakWord() : speakLetter();
      }
    }

    function nextCard() {
      index = (index + 1) % deck.length;
      render();
    }

    function prevCard() {
      index = (index - 1 + deck.length) % deck.length;
      render();
    }

    function reshuffle() {
      deck = shuffle(sets[currentSet]());
      index = 0;
      render();
    }

    document.getElementById("flipBtn").addEventListener("click", flipCard);
    document.getElementById("nextBtn").addEventListener("click", nextCard);
    document.getElementById("prevBtn").addEventListener("click", prevCard);
    document.getElementById("shuffleBtn").addEventListener("click", reshuffle);
    document.getElementById("scene").addEventListener("click", flipCard);

    document.getElementById("speakLetterBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      speakLetter();
    });
    document.getElementById("speakWordBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      speakWord();
    });

    document.getElementById("menuBtn").addEventListener("click", openDrawer);
    overlayEl.addEventListener("click", closeDrawer);
    document.querySelectorAll(".tab.set").forEach(b =>
      b.addEventListener("click", () => setSet(b.dataset.set)));

    document.getElementById("earBtn").addEventListener("click", speakLetter);
    document.getElementById("repeatBtn").addEventListener("click", speakLetter);
    document.getElementById("revealBtn").addEventListener("click", toggleReveal);
    revealCardEl.addEventListener("click", toggleReveal);
    document.getElementById("nextWriteBtn").addEventListener("click", nextCard);
    document.getElementById("shuffleWriteBtn").addEventListener("click", reshuffle);

    document.getElementById("readAloudBtn").addEventListener("click", readChapterAloud);
    document.getElementById("stopReadBtn").addEventListener("click", stopReading);
    document.getElementById("wsClearBtn").addEventListener("click", clearWorksheet);
    document.getElementById("dictEar").addEventListener("click", speakDict);
    document.getElementById("dictRepeat").addEventListener("click", speakDict);
    document.getElementById("dictShow").addEventListener("click", revealDict);
    dictCardEl.addEventListener("click", revealDict);
    document.getElementById("dictRight").addEventListener("click", () => markDict(true));
    document.getElementById("dictWrong").addEventListener("click", () => markDict(false));
    document.getElementById("dictNext").addEventListener("click", () => nextDict());
    document.getElementById("dictRestart").addEventListener("click", () => startDictation());
    document.getElementById("wsPrintBtn").addEventListener("click", () => window.print());
    checkBtn.addEventListener("click", checkAnswer);
    document.getElementById("nextQBtn").addEventListener("click", nextQuestion);
    document.getElementById("restartBtn").addEventListener("click", () =>
      startQuiz({ bank: quiz.bank, bankId: quiz.bankId, test: quiz.test, length: quiz.length }));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDrawer();
      const handler = activity().onKey;
      if (handler) handler(e);
    });

    buildNav();
    const saved = localStorage.getItem("test2Mode");
    setMode(ACTIVITIES.some(a => a.id === saved) ? saved : ACTIVITIES[0].id);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
