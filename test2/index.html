<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>3rd Standard — Test 2 Revision</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="3E Test 2" />

  <style>
    :root {
      --bg1: #fff8e7;
      --bg2: #e8f7ff;
      --card: #ffffff;
      --ink: #1f2937;
      --accent: #ff8a3d;
      --accent2: #3b82f6;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Noto Sans Devanagari", "Mangal", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
    }

    .app {
      width: min(920px, 100%);
      text-align: center;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .pill {
      background: rgba(255,255,255,.8);
      padding: 8px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
    }

    .scene {
      perspective: 1200px;
      width: 100%;
      height: min(58vh, 430px);
      min-height: 330px;
      /* The page title/subtitle are gone, so the long scrolling scenes
         (reading, worksheets) take the freed vertical space. Flashcards and
         the quiz keep the smaller height — they'd just get empty space. */
    }

    #readScene, #worksheetScene {
      height: min(76vh, 640px);
      margin: 0 auto 18px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .55s ease;
    }

    .card.flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 18px 45px rgba(31, 41, 55, .18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      border: 5px solid rgba(255,255,255,.85);
    }

    .front {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,138,61,.18), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(59,130,246,.16), transparent 30%),
        #fff;
    }

    .back {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 75% 20%, rgba(16,185,129,.18), transparent 28%),
        radial-gradient(circle at 20% 85%, rgba(168,85,247,.16), transparent 30%),
        #fff;
    }

    .letter {
      font-size: clamp(7rem, 24vw, 13rem);
      font-weight: 800;
      line-height: 1;
      color: var(--accent2);
      text-shadow: 0 6px 0 rgba(59,130,246,.10);
      transition: transform .15s ease, color .15s ease;
    }
    .letter.speaking { color: #b45309; transform: scale(1.06); }

    /* The letter being recited stays visible on the back of the card, so the
       kid can see which अक्षर the word belongs to while it is spoken. */
    .backLetter {
      position: absolute;
      top: 14px;
      left: 14px;
      min-width: 62px;
      padding: 6px 14px;
      border-radius: 18px;
      background: rgba(59,130,246,.12);
      border: 2px solid rgba(59,130,246,.28);
      color: var(--accent2);
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
    }
    .backLetter.speaking {
      background: rgba(255,214,102,.55);
      border-color: rgba(255,138,61,.7);
      color: #b45309;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .02em;
    }

    .emoji {
      font-size: clamp(4.5rem, 15vw, 8rem);
      line-height: 1;
      margin-bottom: 10px;
    }

    .word {
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 800;
      color: #0f766e;
      margin-bottom: 6px;
    }

    .roman {
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: var(--muted);
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .soundBtn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      box-shadow: 0 6px 16px rgba(0,0,0,.15);
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,.10);
    }

    button:active { transform: scale(.98); }

    .primary { background: var(--accent2); color: white; }
    .secondary { background: white; color: var(--ink); }
    .shuffle { background: var(--accent); color: white; }

    .footer {
      margin-top: 14px;
      font-size: .9rem;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab {
      background: rgba(255,255,255,.75);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: .95rem;
    }

    .tab.active { background: var(--accent2); color: #fff; }
    .tab.set.active { background: var(--accent); color: #fff; }

    .sets { margin-bottom: 16px; }
    .sets .tab { padding: 8px 14px; font-size: .85rem; }

    .listen {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background:
        radial-gradient(circle at 25% 20%, rgba(168,85,247,.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,138,61,.18), transparent 30%),
        #fff;
      box-shadow: 0 18px 45px rgba(31, 41, 55, .18);
      border: 5px solid rgba(255,255,255,.85);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      padding: 24px;
    }

    .earBtn {
      width: clamp(130px, 34vw, 190px);
      height: clamp(130px, 34vw, 190px);
      border-radius: 50%;
      background: var(--accent2);
      color: #fff;
      font-size: clamp(3.5rem, 12vw, 5rem);
      box-shadow: 0 14px 30px rgba(59,130,246,.35);
    }

    .listen .hint { margin-top: 6px; font-size: 1.05rem; }
    .listen .note { color: var(--muted); font-size: .85rem; max-width: 30ch; }

    /* Dictation self-check: a small card the kid flips after writing, to see
       the अक्षर. The answer only enters the DOM at the moment of the flip. */
    .revealScene {
      perspective: 1000px;
      width: min(280px, 70vw);
      height: clamp(110px, 22vw, 150px);
      margin-top: 6px;
    }
    .revealCard {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.2,.8,.2,1);
      cursor: pointer;
    }
    .revealCard.flipped { transform: rotateY(180deg); }
    .revealCard .face {
      border-radius: 22px;
      padding: 10px;
      gap: 2px;
      box-shadow: 0 10px 24px rgba(31,41,55,.14);
    }
    .revealCard .front { background: rgba(59,130,246,.10); color: var(--muted); font-weight: 800; }
    .revealCard .front .q { font-size: 2.4rem; line-height: 1; margin-bottom: 4px; }
    .revealCard .back { background: #fff; }
    .revealCard .revealLetter {
      font-size: clamp(2.6rem, 9vw, 3.6rem);
      font-weight: 800;
      color: var(--accent2);
      line-height: 1;
    }
    .revealCard .revealWord { font-weight: 800; color: #0f766e; font-size: 1.05rem; }
    .revealCard .revealRoman { color: var(--muted); font-weight: 700; font-size: .8rem; }
    .hidden { display: none !important; }

    /* --- maths quiz --- */
    .quiz {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background:
        radial-gradient(circle at 20% 15%, rgba(16,185,129,.16), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(59,130,246,.16), transparent 30%),
        #fff;
      box-shadow: 0 18px 45px rgba(31, 41, 55, .18);
      border: 5px solid rgba(255,255,255,.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      overflow-y: auto;
    }

    .qLabel {
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .04em;
      font-size: .9rem;
      text-transform: uppercase;
    }

    .qText {
      font-size: clamp(1.5rem, 5vw, 2.6rem);
      font-weight: 800;
      line-height: 1.35;
      max-width: 24ch;
    }

    .ansInput {
      width: min(260px, 80%);
      padding: 14px 18px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 800;
      text-align: center;
      border: 3px solid rgba(59,130,246,.35);
      border-radius: 18px;
      outline: none;
      font-family: inherit;
    }

    .ansInput:focus { border-color: var(--accent2); }

    .choices { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .choice {
      background: #fff;
      border: 3px solid rgba(59,130,246,.35);
      color: var(--ink);
      min-width: 76px;
      padding: 12px 18px;
      font-size: 1.4rem;
    }

    .choice.picked { background: var(--accent2); color: #fff; border-color: var(--accent2); }

    .feedback { font-weight: 800; font-size: 1.15rem; min-height: 1.6em; }
    .feedback.right { color: #0f766e; }
    .feedback.wrong { color: #be123c; }

    /* --- reading view --- */
    .reader {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background:
        radial-gradient(circle at 15% 12%, rgba(59,130,246,.10), transparent 30%),
        radial-gradient(circle at 88% 90%, rgba(255,138,61,.12), transparent 30%),
        #fff;
      box-shadow: 0 18px 45px rgba(31, 41, 55, .18);
      border: 5px solid rgba(255,255,255,.85);
      padding: 26px clamp(18px, 4vw, 40px);
      overflow-y: auto;
      text-align: left;
    }

    .readTitle {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--accent2);
      margin-bottom: 4px;
    }

    .readMeta { color: var(--muted); font-weight: 700; margin-bottom: 16px; font-size: .95rem; }

    .readBody p {
      font-size: clamp(1.1rem, 2.6vw, 1.35rem);
      line-height: 1.75;
      margin: 0 0 16px;
      max-width: 60ch;
    }

    .readBody p.speaking { background: rgba(255,214,102,.35); border-radius: 8px; }
    .readBody .empty { color: var(--muted); font-weight: 700; }

    /* Infographics: an optional picture strip for the chapter and an optional
       emoji / image beside a paragraph. Chapters without them look unchanged. */
    .readArt {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 18px;
    }
    .readArt .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(59,130,246,.08);
      border: 2px solid rgba(59,130,246,.18);
      border-radius: 16px;
      padding: 8px 14px;
      font-weight: 700;
      color: var(--accent2);
      font-size: .95rem;
    }
    .readArt .chip .pic { font-size: 1.6rem; line-height: 1; }
    .readArt img.pic { width: 40px; height: 40px; object-fit: contain; }

    .readRow { display: flex; align-items: flex-start; gap: 14px; margin: 0 0 16px; }
    .readRow .side { font-size: 2.4rem; line-height: 1.2; flex: 0 0 auto; }
    .readRow img.side { width: 84px; height: 84px; object-fit: contain; border-radius: 12px; }
    .readRow p { margin: 0; }

    .readFig {
      margin: 0 0 18px;
      padding: 14px 16px;
      background: rgba(255,214,102,.18);
      border: 2px dashed rgba(255,138,61,.45);
      border-radius: 18px;
      max-width: 60ch;
    }
    .readFig img { width: 100%; border-radius: 12px; display: block; }
    .readFig .cap { font-weight: 700; color: var(--muted); font-size: .9rem; margin-top: 8px; }

    /* --- SST practice worksheet --- */
    .worksheet {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      background:
        radial-gradient(circle at 12% 10%, rgba(16,185,129,.10), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(255,138,61,.10), transparent 30%),
        #fff;
      box-shadow: 0 18px 45px rgba(31, 41, 55, .18);
      border: 5px solid rgba(255,255,255,.85);
      padding: 22px clamp(16px, 4vw, 34px);
      overflow-y: auto;
      text-align: left;
    }

    .wsSection { margin-bottom: 26px; }
    .mr { font-size: 1.12em; }
    .wsSpeakGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .wsSpeak { font: inherit; font-size: 1.15rem; padding: 10px; border-radius: 12px; cursor: pointer;
      border: 2px solid rgba(59,130,246,.2); background: #fff; color: var(--ink); text-align: left; }
    .wsSpeak .n { font-size: .75rem; color: var(--muted); }
    .revealCard .dictWord { font-size: clamp(2rem, 9vw, 3.4rem); white-space: nowrap; }
    .wsNotes { margin: 0; padding: 12px 16px 12px 34px; line-height: 1.6;
      background: rgba(59,130,246,.05); border: 2px solid rgba(59,130,246,.14); border-radius: 16px; }
    .wsNotes li { margin-bottom: 6px; }
    .wsNotes li:last-child { margin-bottom: 0; }
    .wsQA { background: rgba(59,130,246,.05); border: 2px solid rgba(59,130,246,.14);
      border-radius: 16px; padding: 12px 16px; margin-bottom: 10px; }
    .wsQA summary { font-weight: 700; line-height: 1.5; cursor: pointer; }
    .wsQA summary::marker { color: var(--accent2); }
    .wsQA[open] summary { margin-bottom: 8px; }
    .wsAns { line-height: 1.6; padding: 10px 12px; border-radius: 10px;
      background: rgba(34,197,94,.10); border-left: 4px solid #22c55e; }
    .wsSection:last-child { margin-bottom: 4px; }
    .wsSection h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent2);
      margin: 0 0 12px;
    }

    .wsQ {
      background: rgba(59,130,246,.05);
      border: 2px solid rgba(59,130,246,.14);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .wsQ p.stem { margin: 0 0 8px; font-weight: 700; line-height: 1.5; }
    .wsQ p.stem .n { color: var(--accent2); margin-right: 4px; }

    .wsOpts { display: grid; gap: 6px; }
    .wsOpt {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .wsOpt:hover { background: rgba(59,130,246,.08); }
    .wsOpt input { margin-top: 3px; accent-color: var(--accent2); }
    .wsOpt.picked { background: rgba(16,185,129,.14); }

    .wsBank {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 14px;
    }
    .wsBank span {
      background: rgba(16,185,129,.12);
      color: #0f766e;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 800;
    }

    .wsBlank {
      border: none;
      border-bottom: 2px dotted rgba(100,116,139,.5);
      background: transparent;
      color: #0f766e;
      font-weight: 800;
      font: inherit;
      padding: 2px 4px;
      min-width: 130px;
    }
    .wsBlank:focus { outline: none; border-bottom-color: var(--accent2); }

    .wsQ textarea {
      width: 100%;
      resize: vertical;
      min-height: 4.2rem;
      border: 2px solid rgba(59,130,246,.14);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 10px 12px;
      margin-top: 4px;
    }
    .wsQ textarea:focus { outline: none; border-color: var(--accent2); }

    .wsTF {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items: center;
    }
    .wsTF .stem { font-weight: 700; margin: 0; }
    .wsTFBtns { display: flex; gap: 6px; }
    .wsTFBtns button {
      border: 2px solid rgba(100,116,139,.3);
      background: #fff;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 800;
      box-shadow: none;
    }
    .wsTFBtns button.true.active { background: #0f766e; border-color: #0f766e; color: #fff; }
    .wsTFBtns button.false.active { background: #be123c; border-color: #be123c; color: #fff; }
    .wsTF .wsCorrect {
      grid-column: 1 / -1;
      border: none;
      border-bottom: 1px dotted rgba(100,116,139,.5);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-style: italic;
      padding: 4px 2px;
      width: 100%;
    }
    .wsTF .wsCorrect:focus { outline: none; border-bottom-color: var(--accent2); }

    .wsOddItems { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .wsOddItems button {
      border: 2px solid rgba(100,116,139,.25);
      background: #fff;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 700;
      box-shadow: none;
    }
    .wsOddItems button.picked {
      background: #be123c; border-color: #be123c; color: #fff;
      text-decoration: line-through wavy;
    }

    .wsNote { color: var(--muted); font-weight: 600; font-size: .85rem; margin: -4px 0 12px; font-style: italic; }

    .wsFieldLabel { font-weight: 700; line-height: 1.5; }
    .wsInline { border: none; border-bottom: 2px dotted rgba(100,116,139,.5); background: transparent;
      color: #0f766e; font-weight: 800; font: inherit; padding: 2px 6px; min-width: 110px; margin: 0 2px; }
    .wsInline:focus { outline: none; border-bottom-color: var(--accent2); }
    .wsInline.narrow { width: 70px; min-width: 0; flex: none; text-align: center; }

    .wsSub { display: grid; gap: 8px; margin-top: 8px; padding-left: 14px; border-left: 3px solid rgba(59,130,246,.18); }
    .wsSub .wsFieldLabel { font-weight: 600; }

    .wsBetween { display: flex; align-items: baseline; gap: 8px; font-weight: 800; font-size: 1.05rem; }

    .wsTableWrap { overflow-x: auto; }
    .wsTable { width: 100%; border-collapse: collapse; }
    .wsTable th, .wsTable td { border: 1px solid rgba(100,116,139,.25); padding: 8px 10px; text-align: center; font-weight: 700; }
    .wsTable th { background: rgba(59,130,246,.08); color: var(--accent2); font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
    .wsTable td u { color: var(--accent2); }

    .wsPlaceRow { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .wsPlaceRow .num { font-weight: 800; font-size: 1.2rem; color: #0f766e; min-width: 70px; }
    .wsPlaceCols { display: flex; gap: 10px; }
    .wsPlaceCol { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .wsPlaceCol span { font-size: .75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; }
    .wsPlaceCol input {
      width: 40px; height: 40px; text-align: center; font-weight: 800; font-size: 1.1rem;
      border: 2px solid rgba(59,130,246,.25); border-radius: 8px; background: #fff; color: var(--ink); font-family: inherit;
    }
    .wsPlaceCol input:focus { outline: none; border-color: var(--accent2); }

    .wsSkipRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; }
    .wsSkipRow .given { color: #0f766e; }
    .wsSkipRow input { width: 62px; }

    .wsQuote {
      font-style: italic; color: var(--ink); background: rgba(255,214,102,.16);
      border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; line-height: 1.6;
    }
    .wsSubQ { display: grid; gap: 4px; margin-bottom: 10px; }
    .wsSubQ label { font-weight: 700; }
    .wsSubQ textarea { width: 100%; resize: vertical; min-height: 3rem;
      border: 2px solid rgba(59,130,246,.14); border-radius: 10px; background: #fff; color: var(--ink);
      font: inherit; padding: 8px 10px; }
    .wsSubQ textarea:focus { outline: none; border-color: var(--accent2); }

    .wsClueLine { font-weight: 700; margin-bottom: 6px; }
    .wsClue textarea { width: 100%; resize: vertical; min-height: 2.6rem;
      border: 2px solid rgba(59,130,246,.14); border-radius: 10px; background: #fff; color: var(--ink);
      font: inherit; padding: 8px 10px; margin-top: 4px; }
    .wsClue textarea:focus { outline: none; border-color: var(--accent2); }

  <script>
    const cards = [
      ["अ","अनार","Anaar","🍎"], ["आ","आम","Aam","🥭"], ["इ","इमली","Imli","🫘"],
      ["ई","ईख","Eekh","🎋"], ["उ","उल्लू","Ullu","🦉"], ["ऊ","ऊन","Oon","🧶"],
      ["ऋ","ऋषि","Rishi","🧘"], ["ए","एड़ी","Edi","🦶"], ["ऐ","ऐनक","Ainak","👓"],
      ["ओ","ओखली","Okhli","🥣"], ["औ","औजार","Auzaar","🛠️"], ["अं","अंगूर","Angoor","🍇"],
      ["अः","दुःख","Dukh","😢"],

      ["क","कबूतर","Kabootar","🕊️"], ["ख","खरगोश","Khargosh","🐇"], ["ग","गमला","Gamla","🪴"],
      ["घ","घर","Ghar","🏠"], ["ङ","अंग","Ang","🧍"], ["च","चम्मच","Chammach","🥄"],
      ["छ","छतरी","Chhatri","☂️"], ["ज","जहाज़","Jahaaz","✈️"], ["झ","झंडा","Jhanda","🚩"],
      ["ञ","पंच","Panch","✋"], ["ट","टमाटर","Tamatar","🍅"], ["ठ","ठेला","Thela","🛒"],
      ["ड","डमरू","Damru","🥁"], ["ढ","ढक्कन","Dhakkan","🫙"], ["ण","गणेश","Ganesh","🐘"],
      ["त","तरबूज","Tarbooz","🍉"], ["थ","थाली","Thaali","🍽️"], ["द","दवात","Davaat","🖋️"],
      ["ध","धनुष","Dhanush","🏹"], ["न","नल","Nal","🚰"], ["प","पतंग","Patang","🪁"],
      ["फ","फल","Phal","🍊"], ["ब","बकरी","Bakri","🐐"], ["भ","भालू","Bhalu","🐻"],
      ["म","मछली","Machhli","🐟"], ["य","यज्ञ","Yagya","🔥"], ["र","रथ","Rath","🛺"],
      ["ल","लट्टू","Lattu","🪀"], ["व","वन","Van","🌳"], ["श","शेर","Sher","🦁"],
      ["ष","षट्कोण","Shatkon","⬡"], ["स","सेब","Seb","🍎"], ["ह","हाथी","Haathi","🐘"],
      ["क्ष","क्षत्रिय","Kshatriya","🛡️"], ["त्र","त्रिशूल","Trishul","🔱"], ["ज्ञ","ज्ञानी","Gyaani","🧠"]
    ];

    // Data order: first 13 entries are swar, the rest are vyanjan.
    const SWAR_COUNT = 13;
    const sets = {
      all: () => cards,
      swar: () => cards.slice(0, SWAR_COUNT),
      vyanjan: () => cards.slice(SWAR_COUNT)
    };
    const setLabels = { all: "स्वर + व्यंजन", swar: "स्वर", vyanjan: "व्यंजन" };

    // ---------------- maths question generators ----------------
    // Each skill mirrors an exercise type from the class-3 workbook (ch.1
    // Numbers, ch.2 Addition) but makes fresh numbers every time, so the kid
    // never runs out of practice. gen() returns:
    //   { q: question text, a: answer, type: "number" | "choice", options?: [] }
    const rnd = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
    const digitsOf = n => String(n).split("").map(Number);
    const pickSome = (arr, n) => shuffle(arr).slice(0, n);
    const roundTo = (n, step) => Math.round(n / step) * step;
    const PLACES = [["ones", 1], ["tens", 10], ["hundreds", 100], ["thousands", 1000]];

    // Two 3-digit numbers whose per-column digits never exceed 9 (no carrying).
    function noCarryPair() {
      const a = [], b = [];
      for (let i = 0; i < 3; i++) {
        const x = rnd(i === 0 ? 1 : 0, 8);
        a.push(x);
        b.push(rnd(i === 0 ? 1 : 0, 9 - x));
      }
      return [Number(a.join("")), Number(b.join(""))];
    }

    const MATH_SKILLS = [
      {
        id: "placeValue",
        label: "Place value",
        gen() {
          const n = rnd(1000, 9999);
          const p = rnd(0, 3);
          const digit = digitsOf(n)[3 - p];
          return {
            q: `In ${n}, what is the place value of the ${PLACES[p][0]} digit (${digit})?`,
            a: digit * PLACES[p][1]
          };
        }
      },
      {
        id: "expanded",
        label: "Expanded form",
        gen() {
          const n = rnd(1000, 9999);
          const parts = digitsOf(n).map((x, i) => x * Math.pow(10, 3 - i));
          return { q: `Write the standard form: ${parts.join(" + ")} = ?`, a: n };
        }
      },
      {
        id: "compare",
        label: "Compare >, <, =",
        gen() {
          const a = rnd(100, 9999);
          const b = Math.random() < 0.25 ? a : rnd(100, 9999);
          return {
            q: `${a} ___ ${b}`,
            a: a > b ? ">" : a < b ? "<" : "=",
            type: "choice",
            options: [">", "<", "="]
          };
        }
      },
      {
        id: "successor",
        label: "Successor & predecessor",
        gen() {
          const n = rnd(100, 9998);
          const after = Math.random() < 0.5;
          return {
            q: `Which number comes just ${after ? "after" : "before"} ${n}?`,
            a: after ? n + 1 : n - 1
          };
        }
      },
      {
        id: "skipCount",
        label: "Skip counting",
        gen() {
          const step = [2, 10, 100, 1000][rnd(0, 3)];
          const start = rnd(1000, 5000);
          const seq = [0, 1, 2, 3].map(i => start + i * step);
          return { q: `Skip count in ${step}s: ${seq.slice(0, 3).join(", ")}, ___`, a: seq[3] };
        }
      },
      {
        id: "rounding",
        label: "Rounding off",
        gen() {
          const step = [10, 100, 1000][rnd(0, 2)];
          const n = rnd(step === 1000 ? 1000 : 100, 9999);
          return { q: `Round off ${n} to the nearest ${step}.`, a: roundTo(n, step) };
        }
      },
      {
        id: "formNumber",
        label: "Form a number",
        gen() {
          const digits = pickSome([1, 2, 3, 4, 5, 6, 7, 8, 9], 4);
          const biggest = Math.random() < 0.5;
          const sorted = [...digits].sort((x, y) => biggest ? y - x : x - y);
          return {
            q: `Using the digits ${digits.join(", ")} without repeating any digit, write the ${biggest ? "largest" : "smallest"} 4-digit number.`,
            a: Number(sorted.join(""))
          };
        }
      },
      {
        id: "addNoCarry",
        label: "Add (no carrying)",
        gen() {
          const [a, b] = noCarryPair();
          return { q: `${a} + ${b} = ?`, a: a + b };
        }
      },
      {
        id: "addCarry",
        label: "Add (with carrying)",
        gen() {
          const a = rnd(150, 899);
          const b = rnd(150, 899);
          return { q: `${a} + ${b} = ?`, a: a + b };
        }
      },
      {
        id: "addThree",
        label: "Add three numbers",
        gen() {
          const [a, b, c] = [rnd(100, 499), rnd(100, 499), rnd(100, 399)];
          return { q: `${a} + ${b} + ${c} = ?`, a: a + b + c };
        }
      },
      {
        id: "mentalAdd",
        label: "Mental addition",
        gen() {
          const a = rnd(21, 89);
          const b = rnd(11, 89);
          return { q: `Add mentally: ${a} + ${b} = ?`, a: a + b };
        }
      },
      {
        id: "missingAddend",
        label: "Missing number",
        gen() {
          const a = rnd(120, 600);
          const b = rnd(50, 380);
          return { q: `${a} + ___ = ${a + b}`, a: b };
        }
      },
      {
        id: "estimateSum",
        label: "Estimate the sum",
        gen() {
          const step = Math.random() < 0.5 ? 10 : 100;
          const nums = [rnd(120, 590), rnd(120, 590), rnd(120, 390)];
          return {
            q: `Estimate ${nums.join(" + ")} by rounding off each number to the nearest ${step}, then adding.`,
            a: nums.reduce((s, n) => s + roundTo(n, step), 0)
          };
        }
      },
      {
        id: "wordProblem",
        label: "Word problems",
        gen() {
          const stories = [
            (x, y, z) => `A library has ${x} storybooks, ${y} academic books and ${z} competition books. How many books are there in all?`,
            (x, y, z) => `Ravi sold ${x} tickets, Meera sold ${y} tickets and Ayesha sold ${z} tickets for the school fest. How many tickets were sold in all?`,
            (x, y, z) => `A garden has ${x} red roses, ${y} pink roses and ${z} white roses. How many roses are there altogether?`,
            (x, y, z) => `Anuj's storybook has ${x} pages, Riya's has ${y} pages and Shaina's has ${z} pages. How many pages are there in all?`,
            (x, y, z) => `A postman delivered ${x} letters in the first week, ${y} in the second week and ${z} in the third week. How many letters did he deliver in all?`
          ];
          const [x, y, z] = [rnd(110, 480), rnd(110, 480), rnd(105, 320)];
          return { q: stories[rnd(0, stories.length - 1)](x, y, z), a: x + y + z };
        }
      }
    ];

    // ---------------- English grammar question bank ----------------
    // Skills follow the class-3 grammar book (nouns, singular/plural, gender),
    // plus collective and material nouns. The word lists are hand-checked
    // because grammar answers are idiomatic, not computable: articles follow
    // sound ("an hour", "a university") and plurals are often irregular.
    const ARTICLE_WORDS = [
      ["apple", "an"], ["orange", "an"], ["egg", "an"], ["umbrella", "an"], ["ice cream", "an"],

      ["leaf", "leaves"], ["knife", "knives"], ["wolf", "wolves"], ["shelf", "shelves"], ["calf", "calves"],

      ["mouse", "mice"], ["goose", "geese"], ["ox", "oxen"],
      ["sheep", "sheep"], ["deer", "deer"], ["fish", "fish"]
    ];

    const GENDER_PAIRS = [
      ["king", "queen"], ["prince", "princess"], ["actor", "actress"], ["lion", "lioness"],
      ["tiger", "tigress"], ["uncle", "aunt"], ["nephew", "niece"], ["father", "mother"],
      ["brother", "sister"], ["son", "daughter"], ["husband", "wife"], ["boy", "girl"],
      ["man", "woman"], ["cock", "hen"], ["drake", "duck"], ["stag", "doe"],
      ["wizard", "witch"], ["sir", "madam"], ["waiter", "waitress"], ["host", "hostess"],
      ["grandfather", "grandmother"], ["bull", "cow"], ["horse", "mare"], ["landlord", "landlady"],
      ["bridegroom", "bride"], ["monk", "nun"], ["emperor", "empress"], ["hero", "heroine"]
    ];

    const COMMON_GENDER = ["teacher", "student", "doctor", "friend", "parent", "cousin", "singer",
      "artist", "neighbour", "child", "principal", "journalist", "person", "baby", "carpenter", "florist"];
    const NEUTER_GENDER = ["desk", "chair", "book", "table", "window", "pencil", "bus", "tree",
      "river", "fan", "computer", "wall", "plate", "lake", "grass", "box", "duster", "blackboard"];

    const COLLECTIVE = [
      ["lions", "pride"], ["birds", "flock"], ["sheep", "flock"], ["cows", "herd"], ["elephants", "herd"],
      ["wolves", "pack"], ["fish", "school"], ["bees", "swarm"], ["ants", "army"], ["puppies", "litter"],

    const PEOPLE = ["Rahul", "Meera", "Ravi", "Aisha", "Kabir", "Naina", "Arjun"];
    const PLACE_NAMES = ["Delhi", "Chennai", "Shimla", "India", "Assam", "Jaipur", "Kerala"];
    const DAYS_MONTHS = ["Monday", "Sunday", "February", "August", "Diwali", "Holi"];
    const PROPER_NOUNS = [...PEOPLE, ...PLACE_NAMES, ...DAYS_MONTHS, "Ganga", "Taj Mahal"];

      "monument", "girl", "teacher", "village", "school", "market", "garden", "bridge"];
    const VERBS = ["run", "sing", "jump", "write", "eat", "sleep", "dance", "read", "swim", "laugh"];
    const ADJECTIVES = ["happy", "tall", "red", "cold", "noisy", "brave", "soft", "tiny", "sweet", "bright"];
    const CATEGORIES = [
      ["bird", ["dove", "seagull", "robin", "kingfisher", "mynah", "ostrich"]],
      ["tree", ["birch", "maple", "cedar", "willow", "banyan", "neem"]],
      ["flower", ["tulip", "lily", "jasmine", "daisy", "rose", "marigold"]],
      ["animal", ["otter", "mole", "hedgehog", "walrus", "giraffe", "buffalo"]]
    ];

    const pick = arr => arr[rnd(0, arr.length - 1)];
    // Build a 4-option multiple choice: the answer plus distractors, shuffled.
    const choiceQ = (q, answer, distractors) => ({
      q, a: answer, type: "choice", options: shuffle([answer, ...distractors])
    });
    const otherThan = (arr, notThese, n) =>
      shuffle(arr.filter(x => !notThese.includes(x))).slice(0, n);

    const GRAMMAR_SKILLS = [
      {
        id: "nounSpot",
        label: "Find the noun",
        gen() {
          const noun = pick(COMMON_NOUNS);
          return choiceQ("Which of these words is a noun (a naming word)?", noun,
            [...otherThan(VERBS, [], 2), pick(ADJECTIVES)]);
        }
      },
      {
        id: "properNoun",
        label: "Common or proper",
        gen() {
          const proper = Math.random() < 0.5;
          const answer = proper ? pick(PROPER_NOUNS) : pick(COMMON_NOUNS);
          const others = otherThan(proper ? COMMON_NOUNS : PROPER_NOUNS, [answer], 3);
          return choiceQ(`Which of these is a ${proper ? "proper" : "common"} noun?`, answer, others);
        }
      },
      {
        id: "capitals",
        label: "Capital letters",
        gen() {
          const name = pick(PEOPLE);
          const place = pick(PLACE_NAMES);
          const right = `${name} lives in ${place}.`;
          return choiceQ("Which sentence is written correctly?", right, [
            right.toLowerCase(),
            `${name.toLowerCase()} lives in ${place}.`,
            `${name} lives in ${place.toLowerCase()}.`
          ]);
        }
      },
      {
        id: "article",
        label: "a or an",
        gen() {
          const [word, art] = pick(ARTICLE_WORDS);
          return choiceQ(`Choose the correct word: ___ ${word}`, art, [art === "a" ? "an" : "a"]);
        }
      },
      {
        id: "plural",
        label: "Singular → plural",
        gen() {
          const [one, many] = pick(PLURALS);
          const fakes = [one + "s", one + "es", one.replace(/y$/, "ies"), one + "ies"]
            .filter(f => f !== many);
          return choiceQ(`What is the plural of "${one}"?`, many, otherThan(fakes, [many], 3));
        }
      },
      {
        id: "pluralSentence",
        label: "Plural in a sentence",
        gen() {
          const [one, many] = pick(PLURALS.filter(([o, m]) => o !== m));
          const frames = [
            n => `I can see three ___ in the garden. (${one})`,
            n => `There are many ___ in our school. (${one})`,
            n => `My friend has two ___ at home. (${one})`
          ];
          const fakes = [one, one + "s", one + "es"].filter(f => f !== many);
          return choiceQ(pick(frames)(one), many, otherThan(fakes, [many], 2));
        }
      },
      {
        id: "feminine",
        label: "Masculine & feminine",
        gen() {
          const [m, f] = pick(GENDER_PAIRS);
          const toFeminine = Math.random() < 0.5;
          const answer = toFeminine ? f : m;
          const pool = GENDER_PAIRS.map(pair => toFeminine ? pair[1] : pair[0]);
          return choiceQ(
            `What is the ${toFeminine ? "feminine" : "masculine"} of "${toFeminine ? m : f}"?`,
            answer, otherThan(pool, [answer], 3));
        }
      },
      {
        id: "genderType",
        label: "Which gender?",
        gen() {
          const kinds = [
            ["masculine", GENDER_PAIRS.map(p => p[0])],
            ["feminine", GENDER_PAIRS.map(p => p[1])],
            ["common", COMMON_GENDER],
            ["neuter", NEUTER_GENDER]
          ];
          const [kind, words] = pick(kinds);
          return {
            q: `What gender is the noun "${pick(words)}"?`,
            a: kind,
            type: "choice",
            options: ["masculine", "feminine", "common", "neuter"]
          };
        }
      },
      {
        id: "collective",
        label: "Collective nouns",
        gen() {
          const [group, word] = pick(COLLECTIVE);
          const pool = [...new Set(COLLECTIVE.map(c => c[1]))];
          return choiceQ(`Choose the collective noun: a ___ of ${group}`, word,
            otherThan(pool, [word], 3));
        }
      },
      {
        id: "material",
        label: "Material nouns",
        gen() {
          const [thing, stuff] = pick(MATERIAL);
          const pool = [...new Set(MATERIAL.map(m => m[1]))];
          return choiceQ(`Choose the material noun: a ${thing} is usually made of ___`, stuff,
            otherThan(pool, [stuff], 3));
        }
      },
      {
        id: "sortWords",
        label: "Which group?",
        gen() {
          const [kind, words] = pick(CATEGORIES);
          const answer = pick(words);
          const others = shuffle(CATEGORIES.filter(c => c[0] !== kind))
            .slice(0, 3).map(c => pick(c[1]));
          return choiceQ(`Which of these is a ${kind}?`, answer, others);
        }
      }
    ];

    let hindiVoice = null;
    function pickVoice() {
      const voices = speechSynthesis.getVoices();
      hindiVoice = voices.find(v => v.lang === "hi-IN")
        || voices.find(v => v.lang && v.lang.startsWith("hi"))
        || null;
    }
    if ("speechSynthesis" in window) {
      pickVoice();
      speechSynthesis.onvoiceschanged = pickVoice;
    }

    function speakBrowser(text, opts = {}) {
      if (!("speechSynthesis" in window)) { opts.onend && opts.onend(); return; }
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "hi-IN";
      if (hindiVoice) utter.voice = hindiVoice;
      utter.rate = opts.rate || 0.6;
      utter.pitch = 1;
      utter.volume = 1;
      utter.onstart = () => opts.onstart && opts.onstart();
      utter.onend = utter.onerror = () => opts.onend && opts.onend();
      speechSynthesis.speak(utter);
    }

    // iOS blocks speechSynthesis until it has been primed inside a real user
    // gesture, so prime it with an empty utterance on the first touch/click.
    let speechUnlocked = false;
    function unlockSpeech() {
      if (speechUnlocked) return;
      speechUnlocked = true;
      if ("speechSynthesis" in window) {
        const warmup = new SpeechSynthesisUtterance("");
        warmup.volume = 0;
        speechSynthesis.speak(warmup);
        pickVoice();
      }
      // Prime the <audio> element inside the gesture too, so the Google TTS
      // clips can start later without a fresh tap (needed on iOS/Safari).
      try {
        ttsAudio.muted = true;
        ttsAudio.src = SILENT_WAV;
        const p = ttsAudio.play();
        if (p && p.catch) p.catch(() => {});
        ttsAudio.muted = false;
      } catch (e) { /* nothing to prime */ }
    }
    document.addEventListener("touchend", unlockSpeech, { once: true });
    document.addEventListener("click", unlockSpeech, { once: true });
    document.addEventListener("keydown", unlockSpeech, { once: true });

    // ---------------- Google Translate TTS ----------------
    // The endpoint wants the full query set — ie/tl/client/q plus idx, total
    // and textlen — and it only honours the slow "ttsspeed" reading when they
    // are all present. A bare q= is what made single letters sound clipped and
    // rushed.
    const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=";
    // The endpoint only switches to its slow reading below ~0.3 — 0.4 returns
    // the same clip as normal speed, 0.24 is measurably longer.
    const TTS_SPEED = 0.24;
    const TTS_MAX = 190;                   // endpoint truncates past ~200 chars

    // Per-letter override hook: if any अक्षर still comes out wrong, map it here
    // to the spelling the TTS pronounces the way the letter is recited,
    // e.g. "अः": "अह".
    const SPEECH_FIX = {};

    function ttsUrl(text, lang, slow) {
      const q = text.slice(0, TTS_MAX);
      return "https://translate.googleapis.com/translate_tts"
        + "?ie=UTF-8&client=gtx"
        + "&tl=" + encodeURIComponent(lang)
        + (slow ? "&ttsspeed=" + TTS_SPEED : "")
        + "&idx=0&total=1"
        + "&textlen=" + q.length
        + "&q=" + encodeURIComponent(q);
    }

    const ttsAudio = new Audio();
    ttsAudio.preload = "auto";
    let speakToken = 0;

    // Cancel whatever the audio element is doing or waiting for.
    function abortAudio() {
      try {
        ttsAudio.onerror = ttsAudio.onstalled = ttsAudio.onplaying = ttsAudio.onended = null;
        ttsAudio.pause();
        ttsAudio.removeAttribute("src");
        ttsAudio.load();
      } catch (e) { /* nothing playing */ }
    }

    // speak(text, {lang, slow, onstart, onend}) — Google voice first, the
    // built-in browser voice as the fallback when the request fails or hangs.
    //
    // iOS caveat: <audio> obeys the hardware silent switch while speechSynthesis
    // does not. A muted iPad plays the Google clip silently — it still fires
    // playing/ended, so nothing here can detect it and no fallback kicks in.
    // The iPad has to be unmuted for the Google voice.
    function speak(text, opts = {}) {
      if (!text) return;
      const lang = opts.lang || "hi";
      const token = ++speakToken;
      let settled = false, started = false;
      const done = () => { if (!settled) { settled = true; opts.onend && opts.onend(); } };
      const fallback = () => {
        if (settled || token !== speakToken) return;
        settled = true;
        // Drop the pending clip, so a slow response cannot play on top of the
        // browser voice a few seconds later.
        abortAudio();
        speakBrowser(text, { rate: opts.rate, onstart: opts.onstart, onend: opts.onend });
      };

      if ("speechSynthesis" in window) speechSynthesis.cancel();
      abortAudio();

      // src first, handlers after: the empty-src error from abortAudio() above
      // is then already past and cannot be mistaken for this clip failing.
      ttsAudio.src = ttsUrl(text, lang, opts.slow !== false);
      ttsAudio.onerror = fallback;
      ttsAudio.onstalled = fallback;
      ttsAudio.onplaying = () => {
        started = true;
        if (token === speakToken) opts.onstart && opts.onstart();
      };
      ttsAudio.onended = () => { if (token === speakToken) done(); };
      const played = ttsAudio.play();
      if (played && played.catch) played.catch(fallback);
      // A blocked or very slow request leaves the element buffering forever —
      // paused is already false by then — so watch for "no sound yet" instead
      // and hand over to the browser voice rather than leaving the kid in
      // silence.
      setTimeout(() => { if (!started) fallback(); }, 1800);
    }

    function stopSpeaking() {
      speakToken++;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      abortAudio();
      markSpeaking(false);
    }

    // Highlight whichever letter is being recited, on both faces of the card.
    function markSpeaking(on) {
      letterEl.classList.toggle("speaking", !!on);
      backLetterEl.classList.toggle("speaking", !!on);

    // A bare अक्षर on its own is the hardest thing for the voice to say, and
    // the hardest thing for a kid to catch, so recitation is always
    // "झ, झ से झरना" — the letter, then the word it starts.
    function recitation([letter, word]) {
      const lead = SPEECH_FIX[letter] || letter;
      return `${lead}, ${lead} से ${word}`;
    }

    function speakLetter() {
      if (!deck[index]) return;          // reading / maths activities have no deck
      const a = activity();
      // Dictation overrides this: it must not give the word away unless the
      // kid has asked for it.
      const raw = a.speechText ? a.speechText(deck[index]) : recitation(deck[index]);
      const text = SPEECH_FIX[raw] || raw;
      speak(text, { onstart: () => markSpeaking(true), onend: () => markSpeaking(false) });
    }

    function speakWord() {
      if (!deck[index]) return;
      speak(recitation(deck[index]), {
        onstart: () => markSpeaking(true),
        onend: () => markSpeaking(false)
      });
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // ---------------- maths quiz engine ----------------
    // Practice mode: endless questions from one skill (or a mix).

    let quiz = { bank: [], skill: "mix", test: false, length: 0, asked: 0, done: 0, correct: 0, q: null, answered: false, over: false };
    // One remembered skill per bank, so switching sections keeps your place.
    const lastSkill = {};

    function buildSkillChips() {
      skillFilterEl.innerHTML = "";
      [{ id: "mix", label: "Mixed" }, ...quiz.bank].forEach(s => {
        const b = document.createElement("button");

    function newQuestion() {

        ? quiz.bank
        : quiz.bank.filter(s => s.id === quiz.skill);
      const skill = pool[rnd(0, pool.length - 1)];

    function updateQuizStatus() {
      counterEl.textContent = quiz.test
        ? `Question ${Math.min(quiz.asked, quiz.length)} / ${quiz.length}`
        : `Question ${quiz.asked}`;
      setNameEl.textContent = `Score ${quiz.correct} / ${quiz.done}`;
    }

    function checkAnswer() {
      if (quiz.over) { startQuiz({ bank: quiz.bank, bankId: quiz.bankId, test: quiz.test, length: quiz.length }); return; }
      if (quiz.answered) { nextQuestion(); return; }

      const given = quiz.q.type === "choice" ? quiz.picked : ansInputEl.value.trim();
      if (given === null || given === "") return;
      const norm = v => String(v).trim().toLowerCase();
      const right = norm(given) === norm(quiz.q.a);
      quiz.answered = true;
      quiz.done++;
      if (right) quiz.correct++;
      feedbackEl.textContent = right
        ? "Correct! 🎉"
        : `Not quite — the answer is ${quiz.q.a}`;
      feedbackEl.className = "feedback " + (right ? "right" : "wrong");
      checkBtn.textContent = "Next question →";
      updateQuizStatus();
    }

    function nextQuestion() {
      if (quiz.over) { startQuiz({ bank: quiz.bank, bankId: quiz.bankId, test: quiz.test, length: quiz.length }); return; }
      if (quiz.test && quiz.asked >= quiz.length && quiz.answered) { finishTest(); return; }
      newQuestion();
    }

    function finishTest() {
      quiz.over = true;
      const pct = Math.round((quiz.correct / quiz.length) * 100);
      qLabelEl.textContent = "Result";
      qTextEl.textContent = `You scored ${quiz.correct} out of ${quiz.length} (${pct}%)`;
      feedbackEl.textContent = pct >= 80 ? "Excellent work! ⭐" : pct >= 50 ? "Good try — keep practising!" : "Let's practise a bit more 💪";
      feedbackEl.className = "feedback right";
      ansInputEl.classList.add("hidden");
      choicesEl.classList.add("hidden");
      checkBtn.textContent = "🔄 Start again";
    }

    // ---------------- reading view ----------------
    // chapter.js defines window.ENGLISH_CHAPTERS = [{id,title,author,type,
    // paragraphs:[...]}]. A local chapters.js may override it.
    // A paragraph is either a string or {text, art, caption, image}. Chapters
    // still carrying the <<PASTE ...>> placeholders count as unfilled, so a
    // half-written chapters.js never hides the text bundled in chapter.js.
    const paraText = (p) => typeof p === "string" ? p : (p && p.text) || "";
    const isFilled = (ch) => Array.isArray(ch && ch.paragraphs)
      && ch.paragraphs.some(p => {
        const t = paraText(p).trim();
        return t && !/^<<.*>>$/.test(t);
      });

    // Merge by id: a filled chapter in chapters.js replaces the bundled one of
    // the same id, and anything extra is appended.
    function chapters() {
      const local = Array.isArray(window.ENGLISH_CHAPTERS) ? window.ENGLISH_CHAPTERS : [];
      const bundled = Array.isArray(window.__BUNDLED_CHAPTERS) ? window.__BUNDLED_CHAPTERS : [];
      const out = [], slot = new Map();
      const add = (ch) => {
        if (!ch) return;
        const key = ch.id || ch.title;
        if (slot.has(key)) {
          // Keep the chapter's place in the book; only real text replaces it.
          if (isFilled(ch)) out[slot.get(key)] = ch;
        } else {
          slot.set(key, out.length);
          out.push(ch);
        }
      };
      bundled.forEach(add);
      local.forEach(add);
      return out.filter(isFilled);
    }
    let currentChapter = 0;
    let readAloudChunks = [], readAloudIdx = 0, reading = false;

    function buildChapterChips() {
      chapterFilterEl.innerHTML = "";
      chapters().forEach((c, i) => {
        const b = document.createElement("button");

        chapterFilterEl.appendChild(b);

    }

    // An "art" value is either an emoji/text string or {img, alt}.
    function artNode(art, cls) {
      if (art && art.img) {
        const img = document.createElement("img");
        img.className = cls;
        img.src = art.img;
        img.alt = art.alt || "";
        img.loading = "lazy";
        return img;
      }
      const span = document.createElement("span");
      span.className = cls;
      span.textContent = typeof art === "string" ? art : (art && art.text) || "";
      return span;
    }

    // Chapter-level picture strip: art: [{pic:"🦅", label:"windhover"}, ...]
    function renderChapterArt(art) {
      if (!Array.isArray(art) || !art.length) return;
      const strip = document.createElement("div");
      strip.className = "readArt";
      art.forEach(item => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.appendChild(artNode(item.pic != null ? item.pic : item, "pic"));
        if (item && item.label) {
          const lbl = document.createElement("span");
          lbl.textContent = item.label;
          chip.appendChild(lbl);
        }
        strip.appendChild(chip);
      });
      readBodyEl.appendChild(strip);
    }

    function renderChapter() {
      stopReading();
      buildChapterChips();
      const list = chapters();
      readBodyEl.innerHTML = "";
      if (!list.length) {
        readTitleEl.textContent = "Reading chapters";
        readMetaEl.textContent = "";
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No reading chapters are loaded. Paste the chapter "
          + "paragraphs into chapter.js (or into a local chapters.js, which "
          + "overrides it) — the <<PASTE ...>> placeholders are skipped.";
        readBodyEl.appendChild(p);
        readerControlsEl.classList.add("hidden");
        counterEl.textContent = "";
        setNameEl.textContent = "Reading";
        return;
      }
      readerControlsEl.classList.remove("hidden");
      const ch = list[currentChapter];
      readTitleEl.textContent = ch.title;
      readMetaEl.textContent = [ch.author && "by " + ch.author, ch.type].filter(Boolean).join(" · ");
      renderChapterArt(ch.art);
      (ch.paragraphs || []).forEach(item => {
        const text = paraText(item);
        if (!text.trim() || /^<<.*>>$/.test(text.trim())) return;
        const art = typeof item === "string" ? null : item;
        const p = document.createElement("p");
        p.textContent = text;

        if (art && art.side) {
          // Small picture beside the paragraph.
          const row = document.createElement("div");
          row.className = "readRow";
          row.appendChild(artNode(art.side, "side"));
          row.appendChild(p);
          readBodyEl.appendChild(row);
        } else {
          readBodyEl.appendChild(p);
        }

        if (art && art.figure) {
          const fig = document.createElement("div");
          fig.className = "readFig";
          fig.appendChild(artNode(art.figure, "pic"));
          if (art.caption) {
            const cap = document.createElement("div");
            cap.className = "cap";
            cap.textContent = art.caption;
            fig.appendChild(cap);
          }
          readBodyEl.appendChild(fig);
        }
      });
      readBodyEl.parentElement.scrollTop = 0;
      counterEl.textContent = `${currentChapter + 1} / ${list.length}`;
      setNameEl.textContent = "Reading";
    }

    // Read the chapter aloud paragraph by paragraph, highlighting the current
    // one. Each paragraph is cut into sentence-sized pieces because the Google
    // voice (much clearer than the built-in one) only takes short queries; the
    // browser voice still covers each piece if a request fails.
    let readAloudParts = [], readAloudPart = 0;

    function splitForTTS(text) {
      const out = [];
      text.split(/(?<=[.!?])\s+/).forEach(sentence => {
        let s = sentence.trim();
        while (s.length > TTS_MAX) {
          let cut = s.lastIndexOf(" ", TTS_MAX);
          if (cut < 40) cut = TTS_MAX;
          out.push(s.slice(0, cut));
          s = s.slice(cut).trim();
        }
        if (s) out.push(s);
      });
      return out;
    }

    function readChapterAloud() {
      stopReading();
      readAloudChunks = [...readBodyEl.querySelectorAll("p")].filter(p => !p.classList.contains("empty"));
      if (!readAloudChunks.length) return;
      readAloudIdx = 0;
      reading = true;
      speakChunk();
    }

    function speakChunk() {
      if (!reading || readAloudIdx >= readAloudChunks.length) { stopReading(); return; }
      const p = readAloudChunks[readAloudIdx];
      readAloudChunks.forEach(x => x.classList.remove("speaking"));
      p.classList.add("speaking");
      p.scrollIntoView({ block: "center" });
      readAloudParts = splitForTTS(p.textContent);
      readAloudPart = 0;
      speakPart();
    }

    function speakPart() {
      if (!reading) return;
      if (readAloudPart >= readAloudParts.length) { readAloudIdx++; speakChunk(); return; }
      const part = readAloudParts[readAloudPart++];
      // Story text reads at normal pace; only the single अक्षर go slow.
      speak(part, { lang: "en", rate: 0.9, slow: false, onend: () => speakPart() });
    }

    function stopReading() {
      reading = false;
      readAloudParts = [];
      stopSpeaking();
      readBodyEl.querySelectorAll("p.speaking").forEach(p => p.classList.remove("speaking"));
    }

    // ---------------- practice worksheets ----------------
    // Fillable, printable worksheets (many question types, not just
    // multiple-choice) rendered straight into the DOM from a plain data
    // object. Answers live only in the page, never saved — Print / Clear are
    // the only actions. Each ACTIVITIES entry with usesDeck:false and an
    // onEnter: () => renderWorksheet(WORKSHEETS.id) reuses the same
    // worksheetScene/worksheetControls markup; adding a worksheet is just a
    // new WORKSHEETS entry (built from `sections`, one per question type
    // below) plus one ACTIVITIES entry — no new markup or render code.
    const el = (tag, cls, html) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (html !== undefined) n.innerHTML = html;
      return n;
    };
    const inp = (cls, placeholder) => {
      const i = document.createElement("input");
      i.type = "text";
      i.className = cls;
      if (placeholder) i.placeholder = placeholder;
      return i;
    };

    // Splits "before ____ after" into an array of text/blank-input pieces
    // and appends them to `p`, so a sentence can hold one or more blanks.
    function appendBlankLine(p, line, cls = "wsBlank") {
      line.split("____").forEach((part, i, arr) => {
        if (part) p.append(part);
        if (i < arr.length - 1) p.appendChild(inp(cls, "____________"));
      });
    }

    const SECTION_RENDERERS = {
      mcq(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach((item, qi) => {
          const q = el("div", "wsQ");
          q.appendChild(el("p", "stem", `<span class="n">${qi + 1}.</span> ${item.q}`));
          const opts = el("div", "wsOpts");
          item.opts.forEach((opt, oi) => {
            const label = el("label", "wsOpt", `<span>${String.fromCharCode(65 + oi)}. ${opt}</span>`);
            const input = document.createElement("input");
            input.type = "radio";
            input.name = `wsMcq${sec.key}${qi}`;
            label.prepend(input);
            label.addEventListener("change", () => {
              opts.querySelectorAll(".wsOpt").forEach(o => o.classList.remove("picked"));
              label.classList.add("picked");
            });
            opts.appendChild(label);
          });
          q.appendChild(opts);
          wrap.appendChild(q);
        });
        return wrap;
      },

      blanks(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        if (sec.wordBank) {
          const bank = el("div", "wsBank");
          sec.wordBank.forEach(w => bank.appendChild(el("span", null, w)));
          wrap.appendChild(bank);
        }
        sec.items.forEach((line, i) => {
          const q = el("div", "wsQ");
          const p = el("p", "stem");
          p.appendChild(el("span", "n", `${i + 1}.`));
          p.append(" ");
          appendBlankLine(p, line);
          q.appendChild(p);
          wrap.appendChild(q);
        });
        return wrap;
      },

      long(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach((item, i) => {
          const stem = typeof item === "string" ? item : item.stem;
          const rows = typeof item === "string" ? 3 : (item.rows || 3);
          const q = el("div", "wsQ");
          q.appendChild(el("p", "stem", sec.items.length > 1 ? `${i + 1}. ${stem}` : stem));
          const ta = document.createElement("textarea");
          ta.rows = rows;
          q.appendChild(ta);
          wrap.appendChild(q);
        });
        return wrap;
      },

      tf(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach((stem, i) => {
          const letter = String.fromCharCode(97 + i);
          const q = el("div", "wsQ wsTF");
          q.appendChild(el("p", "stem", `${letter}. ${stem}`));
          const btns = el("div", "wsTFBtns");
          const tBtn = el("button", "true", "True");
          const fBtn = el("button", "false", "False");
          tBtn.type = fBtn.type = "button";
          tBtn.addEventListener("click", () => { tBtn.classList.add("active"); fBtn.classList.remove("active"); });
          fBtn.addEventListener("click", () => { fBtn.classList.add("active"); tBtn.classList.remove("active"); });
          btns.append(tBtn, fBtn);
          q.appendChild(btns);
          q.appendChild(inp("wsCorrect", "If false, write the correct statement here…"));
          wrap.appendChild(q);
        });
        return wrap;
      },

      odd(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.groups.forEach((group, i) => {
          const words = Array.isArray(group) ? group : group.words;
          const prefix = Array.isArray(group) ? "" : `${group.label} — `;
          const q = el("div", "wsQ");
          q.appendChild(el("p", "stem", `${i + 1}. ${prefix}${words.join(" · ")}`));
          const items = el("div", "wsOddItems");
          words.forEach(word => {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = word;
            b.addEventListener("click", () => {
              items.querySelectorAll("button").forEach(o => o.classList.remove("picked"));
              b.classList.add("picked");
            });
            items.appendChild(b);
          });
          q.appendChild(items);
          wrap.appendChild(q);
        });
        return wrap;
      },

      // Label + one or more inline blanks. item.sub, if present, nests
      // further label+blank rows under item.label (grouped sub-answers like
      // "Largest =" / "Smallest ="  under one prompt).
      fields(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        if (sec.note) wrap.appendChild(el("p", "wsNote", sec.note));
        sec.items.forEach(item => {
          const q = el("div", "wsQ");
          const p = el("p", "wsFieldLabel");
          if (item.sub) {
            p.textContent = item.label;
            q.appendChild(p);
            const sub = el("div", "wsSub");
            item.sub.forEach(s => {
              const row = el("p", "wsFieldLabel");
              row.append(s.label + " ");
              for (let i = 0; i < (s.blanks || 1); i++) row.appendChild(inp("wsInline"));
              sub.appendChild(row);
            });
            q.appendChild(sub);
          } else {
            p.append(item.label + " ");
            for (let i = 0; i < (item.blanks || 1); i++) p.appendChild(inp("wsInline"));
            q.appendChild(p);
          }
          wrap.appendChild(q);
        });
        return wrap;
      },

      // A left value, a small free-text input, a right value — for
      // >/</= comparisons and "write the number between" questions.
      between(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach(item => {
          const q = el("div", "wsQ wsBetween");
          q.append(item.left);
          q.appendChild(inp("wsInline narrow"));
          q.append(item.right);
          wrap.appendChild(q);
        });
        return wrap;
      },

      table(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        const tableWrap = el("div", "wsTableWrap");
        const table = el("table", "wsTable");
        const thead = el("tr");
        sec.headers.forEach(h => thead.appendChild(el("th", null, h)));
        table.appendChild(thead);
        sec.rows.forEach(row => {
          const tr = el("tr");
          row.forEach(cell => {
            const td = document.createElement("td");
            if (cell && cell.input) td.appendChild(inp("wsInline narrow"));
            else td.innerHTML = cell;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        tableWrap.appendChild(table);
        wrap.appendChild(tableWrap);
        return wrap;
      },

      // One labeled input per place-value column (Th/H/T/O) — the digit
      // equivalent of "draw beads on the abacus" for a given number.
      placeColumns(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        if (sec.note) wrap.appendChild(el("p", "wsNote", sec.note));
        sec.items.forEach(item => {
          const q = el("div", "wsQ wsPlaceRow");
          q.appendChild(el("span", "num", item.number));
          const cols = el("div", "wsPlaceCols");
          (item.cols || ["Th", "H", "T", "O"]).forEach(c => {
            const col = el("div", "wsPlaceCol");
            col.appendChild(el("span", null, c));
            col.appendChild(inp(""));
            cols.appendChild(col);
          });
          q.appendChild(cols);
          wrap.appendChild(q);
        });
        return wrap;
      },

      skipCount(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach(item => {
          const q = el("div", "wsQ");
          q.appendChild(el("p", "stem", item.label));
          const row = el("div", "wsSkipRow");
          item.given.forEach(v => row.appendChild(el("span", "given", String(v))));
          for (let i = 0; i < item.blanks; i++) row.appendChild(inp(""));
          q.appendChild(row);
          wrap.appendChild(q);
        });
        return wrap;
      },

      // Clue → single blank ("I am ____.") → a free sentence using the word.
      clue(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach((item, i) => {
          const q = el("div", "wsQ wsClue");
          const p = el("p", "wsClueLine");
          p.appendChild(el("span", "n", `${i + 1}.`));
          p.append(" ");
          appendBlankLine(p, item);
          q.appendChild(p);
          const ta = document.createElement("textarea");
          ta.rows = 2;
          ta.placeholder = "Sentence: …";
          q.appendChild(ta);
          wrap.appendChild(q);
        });
        return wrap;
      },

      // A short cloze paragraph — one flowing block of text with several
      // ____ blanks, plus an optional word bank above it.
      story(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        if (sec.wordBank) {
          const bank = el("div", "wsBank");
          sec.wordBank.forEach(w => bank.appendChild(el("span", null, w)));
          wrap.appendChild(bank);
        }
        const q = el("div", "wsQ");
        const p = el("p", "wsStory");
        appendBlankLine(p, sec.text);
        q.appendChild(p);
        wrap.appendChild(q);
        return wrap;
      },

      // Read-aloud word grid: tap a word to hear it, then write it.
      speakWords(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        const grid = el("div", "wsSpeakGrid");
        sec.words.forEach((w, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "wsSpeak";
          b.innerHTML = `<span class="n">${i + 1}</span> ${w} 🔊`;
          b.addEventListener("click", () => speak(w, { lang: sec.lang || "hi" }));
          grid.appendChild(b);
        });
        wrap.appendChild(grid);
        return wrap;
      },

      // Revision notes: a plain bullet list of key points (trusted HTML).
      notes(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        const ul = el("ul", "wsNotes");
        sec.items.forEach(html => {
          const li = document.createElement("li");
          li.innerHTML = html;
          ul.appendChild(li);
        });
        wrap.appendChild(ul);
        return wrap;
      },

      // Question with a tap-to-reveal model answer.
      qa(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach((item, i) => {
          const d = el("details", "wsQA");
          d.appendChild(el("summary", null, `${i + 1}. ${item.q}`));
          const ans = el("div", "wsAns");
          ans.innerHTML = item.a;
          d.appendChild(ans);
          wrap.appendChild(d);
        });
        return wrap;
      },

      // A quoted passage followed by lettered sub-questions, each with its
      // own answer box (reading-comprehension extracts).
      extract(sec) {
        const wrap = el("div", "wsSection");
        wrap.appendChild(el("h3", null, sec.heading));
        sec.items.forEach((item, i) => {
          const q = el("div", "wsQ");
          q.appendChild(el("p", "stem", `${i + 1}.`));
          q.appendChild(el("div", "wsQuote", item.quote));
          item.subs.forEach((sub, si) => {
            const letter = String.fromCharCode(97 + si);
            const block = el("div", "wsSubQ");
            block.appendChild(el("label", null, `${letter}. ${sub}`));
            const ta = document.createElement("textarea");
            ta.rows = 2;
            block.appendChild(ta);
            q.appendChild(block);
          });
          wrap.appendChild(q);
        });
        return wrap;
      }
    };

            { q: "What are the advantages of helicopter?", a: "Helicopters help to reach difficult terrains like hills, mountains and jungles. The army uses them to transport soldiers and goods to places not connected by any other transport. They also make aids available to places affected by floods, earthquakes or landslides." },
            { q: "Describe the progress of water transport from earlier times till now.", a: "People lived on river banks and first used logs to cross rivers. Then they made rafts with logs and bamboos, which carried only a few people. Later they made canoes and boats that carried many people and goods. With time, ships and boats were made with engines. Today we also have cargo ships, cruise ships, hovercrafts and submarines." },
            { q: "Where do railways run? (notebook Q7)", a: "Railways run on special tracks. These tracks are long rod-like structures made of iron and steel, placed side by side. Trains move on these tracks smoothly." },
            { q: "Write two good and two bad impacts of changes in means of transport. (notebook Q8)", a: "<b>Good:</b> 1. More people can travel together in the same vehicle. 2. Longer distances can be covered in a short span of time.<br><b>Bad:</b> 1. Vehicles cause a lot of air pollution and noise pollution. 2. The cost of travel has increased many times than before." },
            { q: "Why is a bicycle an eco-friendly vehicle? (notebook Q9)", a: "A bicycle is eco-friendly because it does not need any fuel or electricity, hence it does not cause any pollution." },
            { q: "Write the differences between a bullock cart and a car.", a: "Bullock cart: wooden wheels · pulled by bulls · moves slowly · no special features.<br>Car: rubber and metal wheels · an engine makes it move · moves fast · has lots of features." },
            { q: "Think Tank: Which transport would you take to travel abroad with your family and reach soon?", a: "An aeroplane (air transport), because it is the fastest means of transport." },
            { q: "Think Tank: Why does the world seem to have become smaller now?", a: "Because with fast means of transport people can travel to far-off places by road, rail, water or air in a very short time." },
            { q: "Think Tank: There are so many vehicles with engines. Why should we still use a cycle?", a: "A cycle needs no fuel, causes no air or noise pollution, is cheap and keeps us fit and healthy." },
            { q: "Picture study: Who are the two people? What is their contribution? What did it lead to?", a: "They are the <b>Wright Brothers</b>. They invented the <b>first aircraft</b> in the early 20th century. It gradually led to <b>modern aeroplanes</b> that carry hundreds of passengers and goods to far-off places in a short time." },
            { q: "Special vehicles: name them.", a: "Hot air balloon · Fire engine · Tractor" },
            { q: "Train e-ticket: passenger, seat/coach, age, travelling to, train", a: "Shalini Sharma · Coach B3, Seat 0009, Lower Berth · 55 years · Bhopal Jn (BPL) · 2156 Bhopal Express. (Also: from H Nizamuddin, journey 24-Apr-2010, class 3A, fare Rs 765, distance 694 km, PNR 2633711656.)" },
            { q: "Aarav must go from Mumbai to Delhi in a short time. What would you suggest?", a: "An aeroplane — air transport is the fastest means of transport, so he will reach Delhi in a short time." },
            { q: "A village has no proper roads but is near a river. How can they carry goods?", a: "Water transport — boats (or motor boats). The river is close by, and boats can carry a lot of goods from one place to another without roads." },
            { q: "Riya's family wants to reduce air pollution from daily travel. Suggest two things.", a: "1. Use public transport (bus, metro) or car pools instead of a private car.<br>2. Walk or cycle to nearby places; use CNG vehicles." },
            { q: "Imagine there were no wheels. How would travel be different?", a: "There would be no carts, cycles, cars, buses or trains. People would have to walk or ride animals, and carry goods on their backs or on animals. Travelling would be very slow and tiring, and only a few goods could be carried." }

      revAdjectives: {
        title: "Grammar · Adjectives",
        sections: [
          { type: "notes", heading: "📌 Key points", items: [
            "An <b>adjective</b> is a word used to <b>describe a noun or a pronoun</b>.",
            "Describing nouns: <i>a <b>cheerful</b> man, a <b>helpful</b> woman, a <b>narrow</b> road, a <b>blue</b> shirt</i>. Describing pronouns: <i>It is <b>cool</b>. He is <b>happy</b>.</i>",
            "Adjectives tell us <b>what kind</b> (colour, size, shape, taste, feeling): yellow, cute, pretty, red, fresh, stuffy, humid, old, crumbling, haunted, serious, first, new, great, kind, helpful, nice, favourite, sweet, little, splendid, easy.",
            "An adjective must <b>make sense</b> with its noun: a <i>sad</i> bridge ✗, a <i>long</i> boy ✗, an <i>old</i> baby ✗, an <i>ill</i> dress ✗, a <i>fast</i> lake ✗.",
            "Use <b>an</b> before a vowel sound: <i>an old book, an interesting book, an enormous Ferris wheel</i>.",
            "Two adjectives together are separated by a comma: <i>a tiny, colourful bird</i>."
          ] },
          { type: "notes", heading: "↔️ Opposites", items: [
            "soft – <b>hard</b> · difficult – <b>simple/easy</b> · kind – <b>cruel/unkind</b> · shallow – <b>deep</b> · tiny – <b>huge</b> · light – <b>dark</b> · sweet – <b>bitter</b>",
            "light – <b>heavy</b> · strong – <b>weak</b> · hot – <b>cold</b> · deep – <b>shallow</b> · clean – <b>dirty</b> · wide – <b>narrow</b> · old – <b>young</b> · bright – <b>dark/dull</b> · tall – <b>short</b> · big – <b>small</b>"
          ] },
          { type: "notes", heading: "📏 Comparison", items: [
            "Add <b>-er</b> to compare <b>two</b> things or people; add <b>-est</b> to compare <b>more than two</b>. <i>A bus is <b>longer</b> than a car, but a train is the <b>longest</b> of the three.</i>",
            "Use <b>than</b> with -er: <i>taller than</i>. Use <b>the</b> with -est: <i>the tallest</i>.",
            "small – smaller – smallest · smart – smarter – smartest · deep – deeper – deepest · slow – slower – slowest · bright – brighter – brightest · tall – taller – tallest · fast – faster – fastest",
            "Ending in <b>y</b> → change to <b>i</b>: dry – drier – driest · heavy – heavier – heaviest · tasty – tastier – tastiest",
            "Ending in <b>e</b> → add r / st: large – larger – largest",
            "Short vowel + consonant → double it: big – bigger – biggest · hot – hotter – hottest",
            "Special (no pattern): <b>good – better – best · bad – worse – worst · little – less – least · many – more – most</b>"
          ] },
          { type: "qa", heading: "✅ Book exercises — answers", items: [
            { q: "Take Off: What is common to all the highlighted words?", a: "They all <b>describe nouns</b> — they are adjectives." },
            { q: "A. Choose from brackets", a: "1. round · 2. moist · 3. pleasant · 4. raw · 5. delicious · 6. sad · 7. cool · 8. careful" },

            { q: "D. Cross out the adjective that cannot describe the noun", a: "1. bridge – <b>sad</b> · 2. boy – <b>long</b> · 3. baby – <b>old</b> · 4. dress – <b>ill</b> · 5. lake – <b>fast</b>" },
            { q: "E. sloping / coldest / sunny / cold / beautiful", a: "1. cold · 2. sloping · 3. beautiful · 4. coldest · 5. sunny" },
            { q: "F. Complete the table", a: "small – smaller – smallest · smart – smarter – <b>smartest</b> · deep – deeper – <b>deepest</b> · dry – drier – driest · slow – slower – slowest · bright – brighter – brightest" },

            { q: "H. Fill in from brackets", a: "1. better · 2. best · 3. most · 4. more · 5. least · 6. less · 7. worse" }
